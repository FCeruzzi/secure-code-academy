# Test e deploy del Worker Cloudflare (API, pannello, tornei).
# Richiede i secret CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID e la variabile
# ADMIN_USERNAMES.
name: Worker (Cloudflare)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      ADMIN_USERNAMES: ${{ vars.ADMIN_USERNAMES }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Controlla i secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Imposta i secret CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - name: Database D1 e origine del sito
        run: node scripts/ci-configure.mjs
      - name: Migrazioni del database
        run: npx wrangler d1 migrations apply sca --remote
      - name: Deploy
        run: npx wrangler deploy
