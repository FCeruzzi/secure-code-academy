# Build del sito statico e pubblicazione su GitHub Pages.
# Richiede la variabile API_BASE (l'indirizzo del Worker, es.
# https://sca-api.<account>.workers.dev) e Pages con sorgente «GitHub Actions».
name: Sito (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - run: npm ci
      - name: Build
        env:
          API_BASE: ${{ vars.API_BASE }}
          # Facoltativa: host da cui incorporare le presentazioni (default: ogni https).
          FRAME_SRC: ${{ vars.FRAME_SRC }}
          # "/<nome-del-repository>" sul dominio github.io, "" con un dominio tuo.
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::Imposta la variabile del repository API_BASE con l'indirizzo del Worker."
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
