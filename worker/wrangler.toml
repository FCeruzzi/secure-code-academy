# Cloudflare Worker che fa da backend a Secure Code Academy.
# Le pagine stanno su GitHub Pages; qui ci sono l'API dei contenuti, il pannello
# admin (D1) e i tornei live (un Durable Object per torneo).
name = "sca-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
# Origine del sito su GitHub Pages: l'unica a cui il CORS risponde. Più origini
# si separano con una virgola (per esempio un dominio tuo più github.io).
SITE_ORIGIN = "https://fceruzzi.github.io"
# ADMIN_USERNAMES (l'elenco chiuso di chi può amministrare il sito) non sta qui:
# è un secret del Worker, caricato dal workflow dopo il deploy, perché wrangler
# stampa i valori delle [vars] nel log, e il log di un repository pubblico è
# pubblico. In locale lo dà .dev.vars.
# Iterazioni PBKDF2 per le password admin. 100000 è il massimo che il runtime
# dei Workers accetta; vedi il README per il limite di CPU del piano Free.
PBKDF2_ITERATIONS = "100000"

[[d1_databases]]
binding = "DB"
database_name = "sca"
# Sostituito dal workflow con la variabile D1_DATABASE_ID del repository. In
# locale (`wrangler dev`) va bene così: il database locale è un file SQLite.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "TOURNAMENT"
class_name = "TournamentRoom"

# Calcola gli hash delle password fuori dal limite di CPU del Worker
# (src/lib/hasher.ts). Non salva nulla.
[[durable_objects.bindings]]
name = "HASHER"
class_name = "PasswordHasher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TournamentRoom", "PasswordHasher"]

# Limiti di richieste per indirizzo, tenuti dal runtime di Cloudflare: fermano raffiche e
# script prima che costino letture e scritture su D1 o richieste ai Durable Object. Sono
# larghi apposta, perché in un ufficio molti giocatori escono dallo stesso indirizzo. Il
# namespace_id è un numero scelto qui, unico nell'account.
[[ratelimits]]
name = "API_LIMIT"
namespace_id = "51001"
simple = { limit = 2400, period = 60 }

# Iscrizioni ai tornei e login: pochi per indirizzo (le chiavi hanno prefissi diversi).
[[ratelimits]]
name = "ACTION_LIMIT"
namespace_id = "51002"
simple = { limit = 60, period = 60 }

[observability]
enabled = true
